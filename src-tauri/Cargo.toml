[package]
name = "ywatchlist"
version = "1.0.2"
description = "yWatchlist 自選股管理器"
authors = ["you"]
edition = "2021"

[lib]
name = "ywatchlist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1

[[bin]]
name = "ywatchlist"
path = "src/main.rs"
